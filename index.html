<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Advising Appointment</title>
  <link rel="stylesheet" href="styles.css" >
</head>

<body>
  <main class="container">

    <h1>Advising Appointment</h1>
    <form action="thankyou.html" method="post">
      <fieldset>
        <legend>contact info</legend>

      <label for="">enter your first name</label>
      <input type="text" name="firstname" id="firstname" required placeholder="enter name here" autofocus>

      <label for="email">enter your email</label>
      <input type="email" name="email" id="email" required placeholder="enter email here">

      <select name="contact" id="">
        <option value="email">email</option>
        <option value="text">text message</option>
      </select>
 
      

      <input type="submit" value="submit">
       </fieldset>
    </form>

  </main>
</body>

</html>
